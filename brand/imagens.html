<!doctype html>
<!-- Molde das imagens de marca (OG e ícones). Renderizado por brand/gerar-imagens.mjs. -->
<html>
<head>
<meta charset="utf-8" />
<style>
  @font-face { font-family: "Fraunces"; font-style: normal; font-weight: 100 900; src: url(../node_modules/@fontsource-variable/fraunces/files/fraunces-latin-full-normal.woff2) format("woff2"); }
  @font-face { font-family: "Fraunces"; font-style: italic; font-weight: 100 900; src: url(../node_modules/@fontsource-variable/fraunces/files/fraunces-latin-full-italic.woff2) format("woff2"); }
  @font-face { font-family: "Inter"; font-weight: 100 900; src: url(../node_modules/@fontsource-variable/inter/files/inter-latin-wght-normal.woff2) format("woff2"); }
  html, body { margin: 0; }
  body { background: #0e1524; }
  .og { position: relative; width: 1200px; height: 630px; overflow: hidden; color: #f4efe6; font-family: Inter, sans-serif;
    background: radial-gradient(120% 90% at 78% 0%, #1f2b46 0%, rgba(31,43,70,0) 60%), #0e1524; }
  .og canvas { position: absolute; inset: 0; }
  .og .copy { position: absolute; left: 72px; right: 72px; bottom: 64px; }
  .og .brand { position: absolute; left: 72px; top: 56px; display: flex; align-items: center; gap: 14px; }
  .mark { width: 50px; height: 50px; border: 2px solid #f4efe6; border-radius: 50%; display: grid; place-items: center; position: relative;
    font-family: Fraunces; font-style: italic; font-size: 30px; font-variation-settings: "SOFT" 100, "WONK" 1, "opsz" 72; font-weight: 420; }
  .mark svg { position: absolute; right: -9px; top: -8px; width: 24px; height: 24px; }
  .name small { display: block; font-size: 12px; letter-spacing: .22em; text-transform: uppercase; font-weight: 600; opacity: .75; }
  .name span { font-family: Fraunces; font-style: italic; font-size: 30px; font-variation-settings: "SOFT" 100, "WONK" 1; font-weight: 380; }
  h1 { margin: 0 0 22px; font-family: Fraunces; font-weight: 340; font-size: 84px; line-height: .98; letter-spacing: -.025em; font-variation-settings: "SOFT" 40, "WONK" 0; }
  h1 em { font-style: italic; font-weight: 300; font-variation-settings: "SOFT" 100, "WONK" 1; position: relative; }
  h1 em::after { content: ""; position: absolute; left: -2%; right: -2%; bottom: -6px; height: 5px; border-radius: 4px; background: #ff6a4d; transform: rotate(-1deg); }
  .foot { display: flex; justify-content: space-between; font-size: 22px; color: rgba(244,239,230,.75); }
  .foot b { color: #f4efe6; font-weight: 560; }
  .icon { width: 512px; height: 512px; }
  .icon img { display: block; }
</style>
</head>
<body>
  <div class="og" id="og">
    <canvas id="dots" width="1200" height="630"></canvas>
    <div class="brand"><div class="mark">D<svg viewBox="0 0 24 24"><path d="M3.5 13.2c2.1 1.4 3.7 3.2 5 5.3C11.6 12 15.6 7.3 20.8 4" fill="none" stroke="#ff6a4d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
      <div class="name"><small>Professora</small><span>Diana</span></div></div>
    <div class="copy">
      <h1 id="title"></h1>
      <div class="foot"><span id="lead"></span><b>professoradiana.com</b></div>
    </div>
  </div>
  <div class="icon" id="icon"><img src="../public/favicon.svg" width="512" height="512" alt="" /></div>
<script>
  const lang = new URLSearchParams(location.search).get("lang") || "pt";
  const T = {
    pt: { title: 'Diga <em>exatamente</em><br>o que você quer dizer.', lead: "Inglês e português, sob medida.", word: "Olá" },
    en: { title: 'Say <em>exactly</em><br>what you mean.', lead: "Portuguese and English, tailored.", word: "Hello" },
  }[lang];
  document.getElementById("title").innerHTML = T.title;
  document.getElementById("lead").textContent = T.lead;
  // A mesma palavra em partículas do hero, desenhada em pontos.
  document.fonts.load('italic 520 100px "Fraunces"', T.word).then(() => {
    const c = document.getElementById("dots"), x = c.getContext("2d");
    const off = document.createElement("canvas"); off.width = 640; off.height = 300;
    const o = off.getContext("2d"); o.fillStyle = "#fff"; o.font = 'italic 520 250px "Fraunces"'; o.textAlign = "center"; o.fillText(T.word, 320, 230);
    const d = o.getImageData(0, 0, 640, 300).data;
    for (let py = 0; py < 300; py += 3) for (let px = 0; px < 640; px += 3) {
      if (d[(py * 640 + px) * 4 + 3] > 128 && Math.random() < .55) {
        const red = Math.random() < .08;
        x.fillStyle = red ? "rgba(255,106,77,.95)" : "rgba(244,239,230,.85)";
        x.beginPath(); x.arc(540 + px + Math.random() * 2, 20 + py + Math.random() * 2, red ? 1.6 : 1.15, 0, Math.PI * 2); x.fill();
      }
    }
    for (let i = 0; i < 260; i++) { x.fillStyle = `rgba(244,239,230,${Math.random() * .25})`; x.beginPath(); x.arc(Math.random() * 1200, Math.random() * 630, Math.random() * 1.3, 0, 7); x.fill(); }
    document.body.dataset.ready = "1";
  });
</script>
</body>
</html>
